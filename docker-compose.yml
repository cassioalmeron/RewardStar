services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        - API_PORT=${API_PORT}
    container_name: rewardstar-backend
    ports:
      - "${BACKEND_HOST_PORT}:${API_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - DB_PATH=${DB_PATH}
    volumes:
      - backend-data:/app/data
    networks:
      - rewardstar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_APP_NAME=${VITE_APP_NAME}
        - API_PORT=${API_PORT}
    container_name: rewardstar-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      - backend
    networks:
      - rewardstar-network
    restart: unless-stopped

networks:
  rewardstar-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
