<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Reward Star</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">⭐</span>
                    <span class="sidebar-logo sidebar-logo-text">REWARD STAR</span>
                </div>
            </div>

            <div class="sidebar-nav">
                <a href="home-new.html" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="sidebar-text">Home</span>
                </a>

                <a href="game-new.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path>
                    </svg>
                    <span class="sidebar-text">Game</span>
                </a>

                <a href="activity.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    <span class="sidebar-text">Activity</span>
                </a>

                <a href="profile.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="sidebar-text">Profile</span>
                </a>

                <a href="settings.html" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="sidebar-text">Settings</span>
                </a>

                <a href="admin-users.html" class="nav-item" style="margin-top: 2rem; border-top: 2px solid var(--color-concrete); padding-top: 1rem;">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span class="sidebar-text">Admin</span>
                </a>
            </div>

            <div style="margin-top: auto; padding: var(--space-md);">
                <button onclick="logout()" class="nav-item w-full hover:bg-red-500/10 hover:border-l-red-500">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span class="sidebar-text">Logout</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content grid-bg">
            <div class="p-8">
                <!-- Hero Section -->
                <div class="max-w-4xl mx-auto text-center mb-12">
                    <div class="text-9xl mb-6 rotate-star inline-block">⭐</div>
                    <h1 class="neon-lime text-6xl md:text-7xl mb-4" style="font-family: var(--font-display);">
                        REWARD STAR
                    </h1>
                    <p class="neon-magenta text-2xl md:text-3xl mb-6" style="font-family: var(--font-display);">
                        THE ULTIMATE LIFE GAME
                    </p>
                    <p class="text-white text-xl" style="font-family: var(--font-body); font-weight: 600; letter-spacing: 0.05em;">
                        PROCRASTINATION RUNS AWAY
                    </p>
                </div>

                <!-- Stats Grid -->
                <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                    <div class="card-brutal p-6 text-center">
                        <div class="text-5xl mb-3">🎯</div>
                        <div class="neon-lime text-4xl mb-2" style="font-family: var(--font-display);">0</div>
                        <div class="text-white/70 uppercase text-sm" style="font-family: var(--font-body); font-weight: 600; letter-spacing: 0.1em;">Total Points</div>
                    </div>

                    <div class="card-brutal-magenta p-6 text-center">
                        <div class="text-5xl mb-3">🔥</div>
                        <div class="neon-magenta text-4xl mb-2" style="font-family: var(--font-display);">0</div>
                        <div class="text-white/70 uppercase text-sm" style="font-family: var(--font-body); font-weight: 600; letter-spacing: 0.1em;">Day Streak</div>
                    </div>

                    <div class="card-brutal-cyan p-6 text-center">
                        <div class="text-5xl mb-3">⚡</div>
                        <div class="neon-cyan text-4xl mb-2" style="font-family: var(--font-display);">0</div>
                        <div class="text-white/70 uppercase text-sm" style="font-family: var(--font-body); font-weight: 600; letter-spacing: 0.1em;">Achievements</div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="max-w-5xl mx-auto">
                    <h2 class="text-lime-400 text-2xl mb-6" style="font-family: var(--font-display);">QUICK ACTIONS</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <a href="game-new.html" class="card-brutal p-6 block group hover:scale-[1.02] transition-all">
                            <div class="flex items-center gap-4">
                                <div class="text-6xl">🎮</div>
                                <div class="flex-1">
                                    <h3 class="text-lime-400 text-2xl mb-2" style="font-family: var(--font-display);">PLAY GAME</h3>
                                    <p class="text-white/70" style="font-family: var(--font-body);">Start your weekly challenge and earn points</p>
                                </div>
                                <div class="text-lime-400 text-3xl group-hover:translate-x-2 transition-transform">→</div>
                            </div>
                        </a>

                        <a href="activity.html" class="card-brutal-magenta p-6 block group hover:scale-[1.02] transition-all">
                            <div class="flex items-center gap-4">
                                <div class="text-6xl">📋</div>
                                <div class="flex-1">
                                    <h3 class="text-magenta-400 text-2xl mb-2" style="font-family: var(--font-display);">ACTIVITIES</h3>
                                    <p class="text-white/70" style="font-family: var(--font-body);">Manage your weekly schedule</p>
                                </div>
                                <div class="text-magenta-400 text-3xl group-hover:translate-x-2 transition-transform">→</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'login-new.html';
            }
        }
    </script>
</body>
</html>
