<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Reward Star</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2196F3',
                        'primary-dark': '#1976D2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- Registration Container -->
    <div class="min-h-screen flex items-center justify-center p-4 py-12">
        <div class="max-w-md w-full">
            <!-- Logo and Header -->
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">⭐</div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Reward Star</h1>
                <p class="text-gray-600">Create your account</p>
            </div>

            <!-- Registration Card -->
            <div class="bg-white rounded-lg shadow-lg p-8">
                <form id="registerForm" novalidate>
                    <!-- Name Field -->
                    <div class="mb-5">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-smooth"
                            placeholder="Enter your full name"
                            required
                        >
                        <p id="name-error" class="mt-2 text-sm text-red-600 hidden"></p>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-5">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            E-mail <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-smooth"
                            placeholder="Enter your email address"
                            required
                        >
                        <p class="mt-1 text-xs text-gray-500">This will be used for login</p>
                        <p id="email-error" class="mt-2 text-sm text-red-600 hidden"></p>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-5">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-smooth"
                                placeholder="Create a password"
                                required
                            >
                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
                                aria-label="Toggle password visibility"
                            >
                                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                </svg>
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">At least 8 characters with letters and numbers</p>
                        <p id="password-error" class="mt-2 text-sm text-red-600 hidden"></p>

                        <!-- Password Strength Indicator -->
                        <div id="passwordStrength" class="mt-2 hidden">
                            <div class="flex items-center gap-2">
                                <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                                    <div id="strengthBar" class="h-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <span id="strengthText" class="text-xs font-medium"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-6">
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                            Confirm Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-smooth"
                                placeholder="Confirm your password"
                                required
                            >
                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
                                aria-label="Toggle confirm password visibility"
                            >
                                <svg id="eyeIcon2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <svg id="eyeOffIcon2" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                </svg>
                            </button>
                        </div>
                        <p id="confirmPassword-error" class="mt-2 text-sm text-red-600 hidden"></p>
                    </div>

                    <!-- Error Message -->
                    <div id="formError" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg hidden">
                        <p class="text-sm text-red-600"></p>
                    </div>

                    <!-- Success Message -->
                    <div id="formSuccess" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg hidden">
                        <p class="text-sm text-green-600"></p>
                    </div>

                    <!-- Register Button -->
                    <button
                        type="submit"
                        id="registerBtn"
                        class="w-full bg-primary text-white py-3 px-4 rounded-lg font-medium hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-smooth"
                    >
                        <span id="registerBtnText">Create Account</span>
                        <span id="registerBtnLoading" class="hidden">
                            <svg class="inline w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Creating account...
                        </span>
                    </button>

                    <!-- Terms and Privacy -->
                    <p class="mt-4 text-xs text-center text-gray-500">
                        By creating an account, you agree to our
                        <a href="#" class="text-primary hover:text-primary-dark">Terms of Service</a>
                        and
                        <a href="#" class="text-primary hover:text-primary-dark">Privacy Policy</a>
                    </p>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <!-- Google Sign-Up Button -->
                <button
                    type="button"
                    id="googleSignUp"
                    class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2 transition-smooth mb-6"
                >
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Sign up with Google</span>
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Already have an account?</span>
                    </div>
                </div>

                <!-- Login Link -->
                <div class="text-center">
                    <a
                        href="login.html"
                        class="inline-block w-full border border-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2 transition-smooth"
                    >
                        Sign in instead
                    </a>
                </div>
            </div>

            <!-- Footer Link -->
            <div class="mt-6 text-center">
                <a href="home.html" class="text-sm text-gray-600 hover:text-gray-800 transition-smooth">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        // Form elements
        const registerForm = document.getElementById('registerForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const registerBtnText = document.getElementById('registerBtnText');
        const registerBtnLoading = document.getElementById('registerBtnLoading');
        const formError = document.getElementById('formError');
        const formSuccess = document.getElementById('formSuccess');
        const passwordStrength = document.getElementById('passwordStrength');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        // Toggle password visibility
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('hidden');
            eyeOffIcon.classList.toggle('hidden');
        });

        // Toggle confirm password visibility
        const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
        const eyeIcon2 = document.getElementById('eyeIcon2');
        const eyeOffIcon2 = document.getElementById('eyeOffIcon2');

        toggleConfirmPasswordBtn.addEventListener('click', function() {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            eyeIcon2.classList.toggle('hidden');
            eyeOffIcon2.classList.toggle('hidden');
        });

        // Clear error messages on input
        nameInput.addEventListener('input', function() {
            clearFieldError('name');
            hideMessage(formError);
        });

        emailInput.addEventListener('input', function() {
            clearFieldError('email');
            hideMessage(formError);
        });

        passwordInput.addEventListener('input', function() {
            clearFieldError('password');
            hideMessage(formError);
            updatePasswordStrength(passwordInput.value);
        });

        confirmPasswordInput.addEventListener('input', function() {
            clearFieldError('confirmPassword');
            hideMessage(formError);
        });

        // Google Sign-Up
        const googleSignUpBtn = document.getElementById('googleSignUp');

        googleSignUpBtn.addEventListener('click', function() {
            // Show loading message
            showSuccessMessage('Redirecting to Google sign-up...');

            // Simulate Google OAuth redirect
            setTimeout(() => {
                // In production, this would redirect to Google OAuth
                // For demo, simulate successful Google authentication and account creation
                showSuccessMessage('Google authentication successful! Creating your account...');

                setTimeout(() => {
                    // Simulate account creation and redirect to home
                    window.location.href = 'home.html';
                }, 1500);
            }, 1000);
        });

        // Password strength checker
        function updatePasswordStrength(password) {
            if (password.length === 0) {
                passwordStrength.classList.add('hidden');
                return;
            }

            passwordStrength.classList.remove('hidden');

            let strength = 0;
            let color = '';
            let text = '';

            // Length check
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;

            // Complexity checks
            if (/[a-z]/.test(password)) strength += 15;
            if (/[A-Z]/.test(password)) strength += 15;
            if (/[0-9]/.test(password)) strength += 10;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 10;

            // Set color and text based on strength
            if (strength < 30) {
                color = '#ef4444'; // red
                text = 'Weak';
            } else if (strength < 60) {
                color = '#f59e0b'; // orange
                text = 'Fair';
            } else if (strength < 80) {
                color = '#3b82f6'; // blue
                text = 'Good';
            } else {
                color = '#10b981'; // green
                text = 'Strong';
            }

            strengthBar.style.width = strength + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = text;
            strengthText.style.color = color;
        }

        // Form validation
        function validateForm() {
            hideAllMessages();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            let isValid = true;

            // Name validation
            if (!name) {
                showFieldError('name', 'Name is required');
                isValid = false;
            } else if (name.length < 2) {
                showFieldError('name', 'Name must be at least 2 characters');
                isValid = false;
            }

            // Email validation
            if (!email) {
                showFieldError('email', 'E-mail is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }

            // Password validation
            if (!password) {
                showFieldError('password', 'Password is required');
                isValid = false;
            } else if (password.length < 8) {
                showFieldError('password', 'Password must be at least 8 characters');
                isValid = false;
            } else if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                showFieldError('password', 'Password must contain both letters and numbers');
                isValid = false;
            }

            // Confirm password validation
            if (!confirmPassword) {
                showFieldError('confirmPassword', 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showFieldError('confirmPassword', 'Passwords do not match');
                isValid = false;
            }

            return isValid;
        }

        // Form submission
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            // Show loading state
            setLoadingState(true);

            // Get form data
            const formData = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                password: passwordInput.value
            };

            // Simulate API call
            setTimeout(() => {
                // Simulate successful registration
                showSuccessMessage('Account created successfully! Redirecting to login...');

                // Redirect to login page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

                setLoadingState(false);

                // Uncomment below to simulate email already exists error
                /*
                showErrorMessage('E-mail address already exists. Please use a different email or try logging in.');
                setLoadingState(false);
                */

                // Uncomment below to simulate registration failure
                /*
                showErrorMessage('Registration failed. Please try again later.');
                setLoadingState(false);
                */
            }, 1500);
        });

        // Helper functions
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function showFieldError(fieldName, message) {
            const errorElement = document.getElementById(`${fieldName}-error`);
            const inputElement = document.getElementById(fieldName);

            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            inputElement.classList.add('border-red-500', 'focus:ring-red-500');
            inputElement.classList.remove('border-gray-300', 'focus:ring-primary');
        }

        function clearFieldError(fieldName) {
            const errorElement = document.getElementById(`${fieldName}-error`);
            const inputElement = document.getElementById(fieldName);

            errorElement.textContent = '';
            errorElement.classList.add('hidden');
            inputElement.classList.remove('border-red-500', 'focus:ring-red-500');
            inputElement.classList.add('border-gray-300', 'focus:ring-primary');
        }

        function showErrorMessage(message) {
            formError.querySelector('p').textContent = message;
            formError.classList.remove('hidden');
            // Scroll to top of form to show error
            formError.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showSuccessMessage(message) {
            formSuccess.querySelector('p').textContent = message;
            formSuccess.classList.remove('hidden');
            // Scroll to top of form to show success
            formSuccess.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideMessage(element) {
            element.classList.add('hidden');
        }

        function hideAllMessages() {
            hideMessage(formError);
            hideMessage(formSuccess);
            clearFieldError('name');
            clearFieldError('email');
            clearFieldError('password');
            clearFieldError('confirmPassword');
        }

        function setLoadingState(isLoading) {
            if (isLoading) {
                registerBtn.disabled = true;
                registerBtnText.classList.add('hidden');
                registerBtnLoading.classList.remove('hidden');
                registerBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                registerBtn.disabled = false;
                registerBtnText.classList.remove('hidden');
                registerBtnLoading.classList.add('hidden');
                registerBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
