                        <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <div class="container mx-auto">
                <h1 class="text-3xl text-white text-center mb-5">Week Game</h1>

                <div class="bg-[#2a2a2a] p-5 rounded-xl shadow-lg max-w-5xl mx-auto">

                    <div class="flex justify-end mb-5">
                        <button class="px-5 py-2.5 bg-red-500 text-white rounded-md hover:bg-red-600 transition-smooth hover:-translate-y-0.5">
                            Reset Game
                        </button>
                    </div>

                    <!-- Game Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full border-separate border-spacing-1">
                            <thead>
                                <tr>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Description</th>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Monday</th>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Tuesday</th>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Wednesday</th>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Thursday</th>
                                    <th class="bg-transparent text-white font-bold p-2 text-center">Friday</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Row 1 - Easy -->
                                <tr>
                                    <td class="p-2 text-center rounded-md font-bold game-level-easy w-52">
                                        Match pairs of cards
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="#66bb6a" style="display: inline-block;">
                                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>

                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <span class="text-gray-500 font-bold">X</span>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                </tr>

                                <!-- Row 2 - Medium -->
                                <tr>
                                    <td class="p-2 text-center rounded-md font-bold game-level-medium w-52">
                                        Find hidden words
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">

                                        </button>
                                    </td>

                                        </svg>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">

                                            Click
                                        </button>
                                    </td>
                                </tr>

                                    <td class="p-2 text-center rounded-md font-bold game-level-hard w-52">

                                    </td>

                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <button class="bg-green-600 text-white px-4 py-1.5 rounded-md hover:bg-green-700 transition-smooth font-bold text-sm hover:-translate-y-0.5">
                                            Click
                                        </button>

                                            Click
                                        </button>
                                    </td>
                                    <td class="p-2 text-center rounded-md bg-[#3a3a3a]">
                                        <span class="text-gray-500 font-bold">X</span>
                                    </td>
                                </tr>

                                <tr>
                                    <td class="bg-transparent"></td>
                                    <td class="p-2 text-center bg-transparent"></td>
